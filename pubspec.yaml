name: multibook
description: "MultiBook marketplace for stays and services."

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  flutter_bloc: ^9.1.1
  flutter_hooks: ^0.21.3
  go_router: ^16.1.0
  dart_mappable: ^4.6.0
  flutter_svg: ^2.2.0
  get_it: ^8.2.0
  google_fonts: ^6.3.0
  injectable: ^2.5.1
  shared_preferences: ^2.5.3
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  firebase_storage: ^13.0.0
  cloud_firestore: ^6.0.0
  dio: ^5.9.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  async_button_builder: ^3.0.0+1
  image_picker: ^1.2.2
  flutter_image_compress: ^2.5.1
  fl_chart: ^1.2.0
  toastification: ^3.0.3
  country_picker: ^2.0.28
  google_maps_flutter: ^2.14.2
  url_launcher: ^6.3.2
  firebase_messaging: ^16.5.0
  geolocator: ^14.0.2
  circle_flags: ^5.0.1
  u_credit_card: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  dart_mappable_builder: ^4.6.0
  flutter_gen_runner: ^5.11.0
  flutter_launcher_icons: ^0.14.4
  injectable_generator: null

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
