    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  flutter_bloc: ^9.1.1
  flutter_hooks: ^0.21.3
  go_router: ^16.1.0
  dart_mappable: ^4.6.0
